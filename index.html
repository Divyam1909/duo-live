<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#d9475a">
<title>Live location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --ink: #2a2224; --soft: #6f6366; --card: #fffaf9; --accent: #d9475a; --line: #eadfe0; --ok: #2e9c62; --stale: #b7791f; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f4eceb; --soft: #b9aaad; --card: #2a2224; --line: #40363a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--card); }
  #map { position: fixed; inset: 0; }
  .card {
    position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 1000;
    max-width: 460px; margin: 0 auto; padding: 12px 14px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .16);
    display: flex; gap: 12px; align-items: center;
  }
  .face { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 24px; }
  .who { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { color: var(--soft); font-size: 13.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--soft); margin-right: 6px; }
  .dot.live { background: var(--ok); animation: pulse 1.8s infinite; }
  .dot.stale { background: var(--stale); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 156, 98, .55); } 100% { box-shadow: 0 0 0 9px rgba(46, 156, 98, 0); } }
  .bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 1000;
    max-width: 460px; margin: 0 auto; display: flex; gap: 8px;
  }
  .bar a, .bar button {
    flex: 1; padding: 12px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; box-shadow: 0 4px 16px rgba(0, 0, 0, .14);
  }
  .bar a.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .notice { position: fixed; inset: 0; z-index: 2000; display: none; place-items: center; padding: 28px; text-align: center; background: var(--card); }
  .notice.on { display: grid; }
  .notice h1 { font-size: 20px; margin: 10px 0 6px; }
  .notice p { color: var(--soft); margin: 0; max-width: 320px; }
  .notice .big { font-size: 46px; }
  .pin { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); display: grid; place-items: center; font-size: 22px; box-shadow: 0 3px 10px rgba(0, 0, 0, .3); }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-top { top: 86px; }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="card" id="card" hidden>
  <div class="face" id="face">📍</div>
  <div style="min-width:0">
    <div class="who" id="who"></div>
    <div class="state"><span class="dot" id="dot"></span><span id="state"></span></div>
    <div class="state" id="extra"></div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <button id="recentre" type="button">Centre</button>
  <a class="main" id="directions" target="_blank" rel="noopener noreferrer">Open in Maps</a>
</div>

<div class="notice on" id="notice">
  <div>
    <div class="big" id="noticeIcon">📍</div>
    <h1 id="noticeTitle">Finding the location…</h1>
    <p id="noticeText"></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
  // Both are public by design: the key only reaches what the database lets an anonymous visitor see, which is this one lookup.
  const API = "https://auvavcrgpnufwynvzdss.supabase.co/rest/v1/rpc/live_share";
  const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1dmF2Y3JncG51Znd5bnZ6ZHNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDI2NzMsImV4cCI6MjEwNjc3ODY3M30.pFaK-UNdVGGu7N8ZxkpPmuAp1wf7ziXSTpfY1Ib7ICw";
  const FRESH_MS = 150000;
  const POLL_MS = 4000;
  const IDLE_POLL_MS = 20000;
  const TRAIL_MAX = 600;

  const $ = (id) => document.getElementById(id);
  // The token sits after the #, so it is never sent to the site that hosts this page.
  const token = decodeURIComponent(location.hash.replace(/^#/, "")).trim();

  let map, marker, ring, trail, following = true, last = null, skew = 0, timer = null;

  function notice(icon, title, text) {
    $("noticeIcon").textContent = icon;
    $("noticeTitle").textContent = title;
    $("noticeText").textContent = text || "";
    $("notice").classList.add("on");
    $("card").hidden = true;
    $("bar").hidden = true;
  }

  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 10) return "just now";
    if (s < 60) return s + " s ago";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min ago";
    return Math.floor(s / 86400) + " d ago";
  }

  function clock(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function ensureMap(lat, lng, emoji) {
    if (map) return;
    map = L.map("map", { zoomControl: true, attributionControl: true }).setView([lat, lng], 16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
    }).addTo(map);
    trail = L.polyline([], { color: "#d9475a", weight: 4, opacity: 0.55 }).addTo(map);
    ring = L.circle([lat, lng], { radius: 0, color: "#d9475a", weight: 1, fillOpacity: 0.12 }).addTo(map);
    const pin = document.createElement("div");
    pin.className = "pin";
    pin.textContent = emoji || "📍";
    marker = L.marker([lat, lng], { icon: L.divIcon({ html: pin.outerHTML, className: "", iconSize: [44, 44], iconAnchor: [22, 22] }) }).addTo(map);
    // Once someone drags the map it stops chasing the pin, until they ask for it back.
    map.on("dragstart", () => { following = false; });
    $("recentre").addEventListener("click", () => {
      following = true;
      if (last) map.setView([last.lat, last.lng], Math.max(map.getZoom(), 16));
    });
  }

  function paint() {
    if (!last) return;
    const now = Date.now() + skew;
    const age = now - Date.parse(last.fix_at);
    const live = last.live && age < FRESH_MS;
    $("dot").className = "dot " + (live ? "live" : "stale");
    let state;
    if (live) {
      const kmh = last.moving && last.speed >= 1.5 ? Math.round(last.speed * 3.6) : 0;
      state = "Live" + (kmh ? " · moving at " + kmh + " km/h" : last.moving ? " · on the move" : " · staying put");
    } else {
      state = "Last seen " + ago(age);
    }
    $("state").textContent = state;
    const extra = [];
    if (!live) extra.push("at " + clock(last.fix_at));
    if (typeof last.accuracy === "number" && last.accuracy >= 30) extra.push("within about " + Math.round(last.accuracy) + " m");
    if (typeof last.battery === "number") extra.push("🔋 " + last.battery + "%" + (last.charging ? " charging" : ""));
    if (last.expires_at) extra.push("link works until " + clock(last.expires_at));
    $("extra").textContent = extra.join(" · ");
  }

  function show(d) {
    $("notice").classList.remove("on");
    $("card").hidden = false;
    $("bar").hidden = false;
    $("who").textContent = d.name || "Someone";
    $("face").textContent = d.emoji || "📍";
    document.title = (d.name || "Someone") + " · live location";
    ensureMap(d.lat, d.lng, d.emoji);
    const at = [d.lat, d.lng];
    marker.setLatLng(at);
    ring.setLatLng(at);
    ring.setRadius(typeof d.accuracy === "number" && d.accuracy >= 20 ? d.accuracy : 0);
    const moved = !last || last.lat !== d.lat || last.lng !== d.lng;
    if (moved) {
      const points = trail.getLatLngs();
      points.push(at);
      if (points.length > TRAIL_MAX) points.shift();
      trail.setLatLngs(points);
      if (following) map.panTo(at, { animate: true });
    }
    $("directions").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.lat + "," + d.lng);
    last = d;
    paint();
  }

  async function poll() {
    let next = document.hidden ? IDLE_POLL_MS : POLL_MS;
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY },
        body: JSON.stringify({ p_token: token }),
        cache: "no-store",
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      if (d && d.now) skew = Date.parse(d.now) - Date.now();
      if (!d) {
        notice("🔗", "This link doesn't work", "Check that you copied all of it, or ask for a new one.");
        return;
      }
      const name = d.name || "They";
      if (d.status === "ended") {
        notice("⏹️", "This link has ended", name + " is no longer sharing through it.");
        return;
      }
      if (d.status === "paused") {
        last = null;
        notice("⏸️", name + " has paused sharing", "This page picks up again by itself when sharing is back on.");
        next = IDLE_POLL_MS;
      } else if (d.status === "waiting") {
        notice("📍", "Waiting for " + name + "'s location…", "It appears here as soon as their phone sends it.");
      } else if (d.status === "ok" && typeof d.lat === "number" && typeof d.lng === "number") {
        show(d);
      }
    } catch (e) {
      // Offline or a hiccup: keep what is on screen and say so.
      if (last) $("state").textContent = "Reconnecting… last seen " + ago(Date.now() + skew - Date.parse(last.fix_at));
      else notice("📡", "Can't reach the server", "Check your connection. Trying again…");
      next = IDLE_POLL_MS / 2;
    }
    timer = setTimeout(poll, next);
  }

  if (!/^[A-Za-z0-9_-]{22,64}$/.test(token)) {
    notice("🔗", "This link doesn't work", "Check that you copied all of it, or ask for a new one.");
    return;
  }
  setInterval(paint, 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { clearTimeout(timer); poll(); }
  });
  poll();
})();
</script>
</body>
</html>
